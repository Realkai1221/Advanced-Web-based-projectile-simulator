<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Mode — NEA Projectile Simulator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        .lab-layout { display: flex; height: 100vh; overflow: hidden; }
        .control-panel { width: 250px; min-width: 250px; padding: 0.8rem; background: #fff; border-right: 1px solid #ccc; overflow-y: auto; flex-shrink: 0; }
        .control-panel h2 { font-size: 1rem; margin-bottom: 0.8rem; }
        .control-section { margin-bottom: 1rem; }
        .control-section h3 { font-size: 0.8rem; color: #555; margin-bottom: 0.4rem; }
        .slider-group { margin-bottom: 0.5rem; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #555; }
        .slider-group label span { color: #222; font-weight: 600; }
        .slider-group input[type="range"] { width: 100%; }
        .select-group { margin-bottom: 0.5rem; }
        .select-group label { display: block; font-size: 0.85rem; color: #555; }
        .select-group select { width: 100%; padding: 0.3rem; border: 1px solid #ccc; font-size: 0.85rem; }
        .btn-row { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; }
        .btn-row button { flex: 1; }
        .btn-fire { padding: 0.5rem; border: none; background: #4a7ebf; color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn-reset { padding: 0.5rem; border: 1px solid #ccc; background: #fff; color: #555; font-size: 0.9rem; cursor: pointer; }
        .speed-buttons { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .speed-btn { padding: 0.2rem 0.4rem; border: 1px solid #ccc; background: #eee; color: #555; font-size: 0.75rem; cursor: pointer; }
        .speed-btn.active { background: #4a7ebf; color: #fff; }
        .centre-area { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .canvas-area { flex: 1 1 0; display: flex; align-items: center; justify-content: center; padding: 0.5rem; position: relative; overflow: hidden; min-height: 0; }
        #simCanvas { border: 1px solid #ccc; display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
        .velocity-hud { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.9); border: 1px solid #ccc; padding: 0.5rem; min-width: 140px; font-size: 0.8rem; }
        .hud-title { font-size: 0.7rem; color: #555; margin-bottom: 0.3rem; }
        .hud-row { font-size: 0.8rem; line-height: 1.5; }
        .hud-label { color: #555; }
        .hud-value { font-weight: 600; font-family: monospace; }
        .hud-unit { color: #888; font-size: 0.7rem; }
        .step-panel { padding: 0.6rem; background: #fff; border-top: 1px solid #ccc; overflow-y: auto; max-height: 250px; flex-shrink: 0; }
        .step-hint { color: #888; font-size: 0.85rem; text-align: center; }
        .step-content h3 { font-size: 0.9rem; margin-bottom: 0.4rem; }
        .step-section { margin-bottom: 0.5rem; }
        .step-label { font-size: 0.8rem; font-weight: 600; color: #4a7ebf; }
        .katex-line { margin: 0.1rem 0; overflow-x: auto; }
        .katex { font-size: 0.9rem !important; }
        .assignment-banner { padding: 0.5rem; background: #e8f0fe; border: 1px solid #4a7ebf; margin-bottom: 0.8rem; }
        .assignment-banner-name { font-weight: 600; color: #4a7ebf; }
        .assignment-banner-meta { font-size: 0.75rem; color: #555; }
        .assignment-feedback { margin-top: 0.3rem; font-size: 0.85rem; min-height: 1.2rem; }
        .assignment-feedback.hit { color: green; font-weight: 600; }
        .assignment-feedback.miss { color: red; }
        .graph-panel { width: 260px; min-width: 260px; padding: 0.5rem; background: #fff; border-left: 1px solid #ccc; overflow-y: auto; flex-shrink: 0; }
        .graph-box { margin-bottom: 0.5rem; }
        .graph-title { font-size: 0.7rem; color: #555; margin-bottom: 0.2rem; }
        .graph-canvas-wrap { height: 140px; position: relative; }
        .graph-canvas-wrap canvas { width: 100% !important; height: 100% !important; }
        .obstacle-btns { display: flex; gap: 0.3rem; margin-bottom: 0.4rem; }
        .obstacle-btns button { flex: 1; padding: 0.3rem; font-size: 0.75rem; }
        .toggle-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; }
        .toggle-row label { font-size: 0.85rem; color: #555; cursor: pointer; }
        .multi-config-row { margin-bottom: 0.4rem; }
        .optimal-result { margin-top: 0.4rem; padding: 0.4rem; background: #e8f0fe; font-size: 0.8rem; }
        .optimal-result .value { font-weight: 600; color: #4a7ebf; }
    </style>
</head>
<body>
    <div class="lab-layout">
        <!-- Left Control Panel -->
        <div class="control-panel">
            <h2>Lab Mode</h2>

            <!-- Assignment banner (hidden in free mode) -->
            <div id="assignmentBanner" class="assignment-banner hidden">
                <div id="assignmentName" class="assignment-banner-name"></div>
                <div id="assignmentTarget" class="assignment-banner-meta"></div>
                <div id="assignmentFeedback" class="assignment-feedback"></div>
            </div>

            <div class="control-section">
                <h3>Launch Parameters</h3>
                <div class="slider-group">
                    <label>Angle <span id="angleValue">45°</span></label>
                    <input type="range" id="angle" min="0" max="90" step="0.5" value="45">
                </div>
                <div class="slider-group">
                    <label>Velocity <span id="velocityValue">30 m/s</span></label>
                    <input type="range" id="velocity" min="1" max="100" step="0.5" value="30">
                </div>
                <div class="slider-group">
                    <label>Mass <span id="massValue">1 kg</span></label>
                    <input type="range" id="mass" min="0.1" max="10" step="0.1" value="1">
                </div>
            </div>

            <div class="control-section">
                <h3>Environment</h3>
                <div class="slider-group">
                    <label>Gravity <span id="gravityValue">9.81 m/s²</span></label>
                    <input type="range" id="gravity" min="0.1" max="25" step="0.01" value="9.81">
                </div>
                <div class="select-group">
                    <label>Drag Model</label>
                    <select id="dragModel">
                        <option value="none">None (vacuum)</option>
                        <option value="linear">Linear</option>
                        <option value="quadratic">Quadratic</option>
                    </select>
                </div>
                <div id="dragCoefficientGroup" class="slider-group hidden">
                    <label>Drag Coefficient <span id="dragCoefficientValue">0.5</span></label>
                    <input type="range" id="dragCoefficient" min="0.01" max="5" step="0.01" value="0.5">
                    <div id="dragForceLabel" style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.2rem;"></div>
                </div>
            </div>

            <div class="btn-row">
                <button id="fireBtn" class="btn-fire">Fire</button>
                <button id="resetBtn" class="btn-reset">Reset</button>
            </div>

            <div class="control-section">
                <h3>Playback Speed</h3>
                <div class="speed-buttons">
                    <button class="speed-btn" data-speed="0">Pause</button>
                    <button class="speed-btn" data-speed="0.1">0.1x</button>
                    <button class="speed-btn" data-speed="0.25">0.25x</button>
                    <button class="speed-btn" data-speed="0.5">0.5x</button>
                    <button class="speed-btn active" data-speed="1">1x</button>
                </div>
            </div>

            <div class="control-section">
                <h3>Obstacles</h3>
                <div class="obstacle-btns">
                    <button id="obstacleToggleBtn" class="btn-reset">Place Obstacle</button>
                    <button id="obstacleClearBtn" class="btn-reset">Clear All</button>
                </div>
                <div class="slider-group">
                    <label>Width <span id="obstacleWidthValue">10m</span></label>
                    <input type="range" id="obstacleWidth" min="2" max="30" step="1" value="10">
                </div>
                <div class="slider-group">
                    <label>Height <span id="obstacleHeightValue">10m</span></label>
                    <input type="range" id="obstacleHeight" min="2" max="30" step="1" value="10">
                </div>
                <div class="slider-group">
                    <label>Restitution <span id="obstacleRestitutionValue">0.7</span></label>
                    <input type="range" id="obstacleRestitution" min="0" max="1" step="0.05" value="0.7">
                </div>
            </div>

            <div class="control-section">
                <h3>Multi-Launch</h3>
                <div class="toggle-row">
                    <input type="checkbox" id="multiLaunchToggle">
                    <label for="multiLaunchToggle">Enable multi-launch</label>
                </div>
                <div id="multiLaunchPanel" class="hidden">
                    <div id="multiLaunchConfigs"></div>
                    <button id="multiLaunchAdd" class="btn-reset" style="font-size:0.75rem; padding:0.3rem; width:100%; margin-top:0.3rem;">+ Add Projectile</button>
                </div>
            </div>

            <div class="control-section">
                <h3>Optimisation</h3>
                <button id="optimalAngleBtn" class="btn-reset" style="width:100%;">Find Optimal Angle</button>
                <div id="optimalResult"></div>
            </div>
        </div>

        <!-- Centre: Canvas + Step-by-Step -->
        <div class="centre-area">
            <div class="canvas-area">
                <canvas id="simCanvas" width="800" height="500"></canvas>
                <div id="velocityHud" class="velocity-hud"></div>
            </div>
            <div id="stepByStepPanel" class="step-panel">
                <p class="step-hint">Pause the simulation and click on the trajectory to inspect a step.</p>
            </div>
        </div>

        <!-- Right: Graph Panel -->
        <div id="graphPanelContainer" class="graph-panel"></div>
    </div>

    <!-- CDN Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Physics engine (dependency order) -->
    <script src="js/shared/physics/entity.js"></script>
    <script src="js/shared/physics/physicsState.js"></script>
    <script src="js/shared/physics/dragModels.js"></script>
    <script src="js/shared/physics/trajectoryRecorder.js"></script>
    <script src="js/shared/physics/projectile.js"></script>
    <script src="js/shared/physics/target.js"></script>
    <script src="js/shared/physics/obstacle.js"></script>
    <script src="js/shared/physics/collisionResolver.js"></script>
    <script src="js/shared/physics/simulationEnvironment.js"></script>

    <!-- Shared -->
    <script src="js/shared/api.js"></script>
    <script src="js/shared/nav.js"></script>
    <script>nav.init('lab');</script>

    <!-- Algorithms -->
    <script src="js/shared/algorithms/goldenSectionSearch.js"></script>

    <!-- Lab mode -->
    <script src="js/lab/canvasRenderer.js"></script>
    <script src="js/lab/velocityOverlay.js"></script>
    <script src="js/lab/graphPanel.js"></script>
    <script src="js/lab/stepByStep.js"></script>
    <script src="js/lab/obstacleEditor.js"></script>
    <script src="js/lab/multiLaunch.js"></script>
    <script src="js/lab/labController.js"></script>
</body>
</html>
